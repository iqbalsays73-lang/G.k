<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prachin Bharat Master Portal - Complete Edition</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1, h2 { color: #38bdf8; text-align: center; }
        .subject-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { background: #334155; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #0284c7; }
        .card { background: #334155; padding: 18px; margin: 12px 0; border-radius: 8px; border-left: 5px solid #38bdf8; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #0369a1; }
        .btn-test { background: #16a34a; }
        .btn-test:hover { background: #15803d; }
        .locked { opacity: 0.5; pointer-events: none; }
        .option-label { display: block; background: #475569; padding: 10px; margin: 6px 0; border-radius: 5px; cursor: pointer; }
        .option-label:hover { background: #64748b; }
    </style>
    <!-- Dynamic JS Data Files Included -->
    <script src="history.js"></script>
    <script src="geography.js"></script>
    <script src="polity.js"></script>
    <script src="economics.js"></script>
</head>
<body>
    <div class="container">
        <h1>Prachin Bharat & GS Master Portal 🚀</h1>
        <p style="text-align:center;">SSC / UPSSSC PET Complete One-Liners & PYQ Tests</p>
        
        <div class="subject-tabs">
            <button class="tab-btn active" onclick="switchSubject('history')">History</button>
            <button class="tab-btn" onclick="switchSubject('geography')">Geography</button>
            <button class="tab-btn" onclick="switchSubject('polity')">Polity</button>
            <button class="tab-btn" onclick="switchSubject('economics')">Economics</button>
        </div>

        <div id="app-body">
            <!-- Content will be rendered dynamically -->
        </div>
    </div>

    <script>
        let currentSubject = 'history';

        function switchSubject(subject) {
            currentSubject = subject;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderDashboard();
        }

        function renderDashboard() {
            let data = window[currentSubject + 'Data'] || { chapters: [] };
            let html = `<h2>${currentSubject.toUpperCase()} Chapters</h2><div class="grid">`;
            
            if (!data.chapters || data.chapters.length === 0) {
                html += `<div class="card"><p>Data load ho raha hai... Kripya file link check karein.</p></div>`;
            } else {
                data.chapters.forEach(ch => {
                    html += `<div class="card ${ch.unlocked ? '' : 'locked'}">
                        <h3>Chapter ${ch.id}: ${ch.title} ${ch.unlocked ? '🔓' : '🔒'}</h3>
                        <p>${ch.unlocked ? 'Padhne aur Practice ke liye shuru karein.' : 'Unlock karne ke liye pichla 3-Chapter Test (70%+) paas karein.'}</p>
                        <button class="btn" ${ch.unlocked ? '' : 'disabled'} onclick="startChapter(${ch.id})">Start Chapter</button>
                    </div>`;
                });
            }
            html += `</div>`;
            document.getElementById('app-body').innerHTML = html;
        }

        function startChapter(chId) {
            let data = window[currentSubject + 'Data'];
            let ch = data.chapters.find(c => c.id === chId);
            
            let html = `<h2>${ch.title}</h2>
                <div class="card">
                    <h3>💡 Short Trick / Concept</h3>
                    <p>${ch.trick || 'Iss chapter ko dhyan se padhein.'}</p>
                </div>
                <h3>One-Liner Questions & Practice</h3>`;

            ch.questions.forEach((q, idx) => {
                html += `<div class="card"><p><b>Q${idx + 1}: ${q.q}</b></p><p style="color:#38bdf8;">Ans: ${q.a}</p></div>`;
            });

            html += `<button class="btn" onclick="renderDashboard()">Back to Dashboard</button>`;
            
            if (chId % 3 === 0) {
                html += ` <button class="btn btn-test" onclick="startTest(${chId})">Take 3-Chapter PYQ Test</button>`;
            }

            document.getElementById('app-body').innerHTML = html;
        }

        function startTest(chId) {
            let data = window[currentSubject + 'Data'];
            let testQuestions = data.tests ? data.tests[chId] : [];

            if (!testQuestions || testQuestions.length === 0) {
                alert("Is test ke questions add ho rahe hain!");
                return;
            }

            let html = `<h2>PYQ Test (Chapters ${chId - 2} to ${chId})</h2><form id="testForm">`;
            testQuestions.forEach((q, idx) => {
                html += `<div class="card"><p><b>Q${idx + 1}: ${q.q}</b></p>`;
                q.options.forEach((opt, oIdx) => {
                    html += `<label class="option-label"><input type="radio" name="q${idx}" value="${oIdx}"> ${opt}</label>`;
                });
                html += `</div>`;
            });
            html += `</form><button class="btn btn-test" onclick="submitTest(${chId})">Submit Test</button>`;
            document.getElementById('app-body').innerHTML = html;
        }

        function submitTest(chId) {
            let data = window[currentSubject + 'Data'];
            let testQuestions = data.tests[chId];
            let score = 0;

            testQuestions.forEach((q, idx) => {
                let selected = document.querySelector(`input[name="q${idx}"]:checked`);
                if (selected && parseInt(selected.value) === q.ans) {
                    score++;
                }
            });

            let percentage = (score / testQuestions.length) * 100;

            if (percentage >= 70) {
                alert(`🎉 MUBARAK HO! Aapne ${percentage.toFixed(0)}% score kiya hai. Agle chapters UNLOCK ho gaye hain!`);
                data.chapters.forEach(ch => {
                    if (ch.id > chId && ch.id <= chId + 3) ch.unlocked = true;
                });
                renderDashboard();
            } else {
                alert(`❌ Aapka score ${percentage.toFixed(0)}% hai. Agla level unlock karne ke liye kam se kam 70% chahiye. Phir se try karein!`);
                startTest(chId);
            }
        }

        // Initialize portal on load
        window.onload = renderDashboard;
    </script>
</body>
</html>
