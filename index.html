<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Exam Master Portal - All Unlocked</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        h1, h2, h3 { color: #38bdf8; text-align: center; }
        .motto { text-align: center; color: #4ade80; font-weight: bold; margin-bottom: 25px; }
        .exam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .exam-card { background: #334155; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .exam-card:hover, .exam-card.active { border-color: #38bdf8; background: #1e293b; }
        .subject-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { background: #334155; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #0284c7; }
        .card { background: #334155; padding: 20px; margin: 15px 0; border-radius: 8px; border-left: 5px solid #38bdf8; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #0369a1; }
        .btn-test { background: #16a34a; margin-left: 10px; }
        .btn-test:hover { background: #15803d; }
        .trick-box { background: #064e3b; color: #a7f3d0; padding: 12px; border-radius: 6px; margin: 10px 0; font-weight: bold; line-height: 1.6; }
        .theory-box { background: #1e293b; padding: 15px; border-radius: 6px; line-height: 1.7; }
        .option-label { display: block; background: #475569; padding: 10px 14px; margin: 8px 0; border-radius: 6px; cursor: pointer; }
        .option-label:hover { background: #64748b; }
    </style>

    <script src="history_data.js"></script>
    <script src="geography_data.js"></script>
    <script src="polity_data.js"></script>
    <script src="economics_data.js"></script>
</head>
<body>
    <div class="container">
        <h1>भारत का मुफ़्त शिक्षा मास्टर पोर्टल 🚀</h1>
        <p class="motto">"सभी चैप्टर्स पूर्णतः अनलॉक्ड — विस्तृत थ्योरी, शॉर्ट ट्रिक्स और PYQ प्रैक्टिस सेट!"</p>

        <h3>1. अपनी परीक्षा चुनें:</h3>
        <div class="exam-grid">
            <div class="exam-card active" onclick="selectExam('upssssc')">🎯 UPSSSC PET / VDO</div>
            <div class="exam-card" onclick="selectExam('ssc')">🏆 SSC (CGL / CHSL / GD)</div>
            <div class="exam-card" onclick="selectExam('upsi')">👮 UP SI / Police</div>
            <div class="exam-card" onclick="selectExam('upsc')">🏛️ UPSC / State PCS Pre</div>
        </div>

        <div class="subject-tabs">
            <button class="tab-btn active" onclick="switchSubject('history')">📜 History (इतिहास)</button>
            <button class="tab-btn" onclick="switchSubject('geography')">🌍 Geography (भूगोल)</button>
            <button class="tab-btn" onclick="switchSubject('polity')">⚖️ Polity (संविधान)</button>
            <button class="tab-btn" onclick="switchSubject('economics')">📈 Economics (अर्थशास्त्र)</button>
        </div>

        <div id="app-body"></div>
    </div>

    <script>
        let currentExam = 'upssssc';
        let currentSubject = 'history';

        function selectExam(examKey) {
            currentExam = examKey;
            document.querySelectorAll('.exam-card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderDashboard();
        }

        function switchSubject(subKey) {
            currentSubject = subKey;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderDashboard();
        }

        function renderDashboard() {
            let dataVar = currentSubject + 'Data';
            let data = window[dataVar] || null;

            if(!data) {
                document.getElementById('app-body').innerHTML = `<div class="card"><h3>Data Loading...</h3></div>`;
                return;
            }

            let html = `2. ${currentExam.toUpperCase()} - ${data.subjectName}</h2><div class="grid">`;
            data.chapters.forEach(ch => {
                html += `<div class="card">
                    <h3>Chapter ${ch.id}: ${ch.title} 🔓</h3>
                    <p>विस्तृत थ्योरी, शॉर्ट ट्रिक्स और प्रैक्टिस सेट हल करने के लिए नीचे क्लिक करें।</p>
                    <button class="btn" onclick="openChapter(${ch.id})">📖 थ्योरी व ट्रिक्स पढ़ें</button>
                    <button class="btn btn-test" onclick="startChapterTest(${ch.id})">📝 Chapter ${ch.id} Practice Set</button>
                </div>`;
            });
            html += `</div>`;
            document.getElementById('app-body').innerHTML = html;
        }

        function openChapter(id) {
            let data = window[currentSubject + 'Data'];
            let ch = data.chapters.find(c => c.id === id);

            let html = `<h2>${ch.title}</h2>
                <div class="card">
                    <h3>💡 Master Short Trick (स्मार्ट ट्रिक)</h3>
                    <div class="trick-box">${ch.trick}</div>
                    
                    <h3>📖 Complete Theory & Important Points</h3>
                    <div class="theory-box">${ch.theory}</div>
                </div>
                <button class="btn" onclick="renderDashboard()">⬅️ Back to Dashboard</button>
                <button class="btn btn-test" onclick="startChapterTest(${id})">📝 Is Chapter Ka Test Dein</button>`;

            document.getElementById('app-body').innerHTML = html;
        }

        function startChapterTest(id) {
            let data = window[currentSubject + 'Data'];
            let ch = data.chapters.find(c => c.id === id);
            let questions = ch.questions || [];

            if(questions.length === 0) {
                alert("Is chapter ke questions jald hi add ho rahe hain!");
                return;
            }

            let html = `<h2>Chapter ${id}: ${ch.title} - PYQ Practice Set</h2><form id="testForm">`;
            questions.forEach((q, idx) => {
                html += `<div class="card"><p><b>Q${idx + 1}: ${q.q}</b></p>`;
                q.options.forEach((opt, oIdx) => {
                    html += `<label class="option-label"><input type="radio" name="q${idx}" value="${oIdx}"> ${opt}</label>`;
                });
                html += `</div>`;
            });
            html += `</form>
                <button class="btn btn-test" onclick="submitChapterTest(${id})">Test Submit Karein</button>
                <button class="btn" onclick="renderDashboard()">Cancel</button>`;

            document.getElementById('app-body').innerHTML = html;
        }

        function submitChapterTest(id) {
            let data = window[currentSubject + 'Data'];
            let ch = data.chapters.find(c => c.id === id);
            let questions = ch.questions || [];
            let score = 0;

            questions.forEach((q, idx) => {
                let selected = document.querySelector(`input[name="q${idx}"]:checked`);
                if (selected && parseInt(selected.value) === q.ans) {
                    score++;
                }
            });

            let percentage = (score / questions.length) * 100;
            alert(`Aapka Score: ${score}/${questions.length} (${percentage.toFixed(0)}%)\n\nShabash! Practice jaari rakhein.`);
            renderDashboard();
        }

        window.onload = renderDashboard;
    </script>
</body>
</html>
