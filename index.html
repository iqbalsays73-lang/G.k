<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Halwa - Ancient History Master Hub</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --border: #1f2937;
            --trick-bg: #1e1b4b;
            --trick-border: #6366f1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 980px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 5px;
        }
        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        /* Top Navigation & Controls */
        .control-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .select-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        select, button.lang-toggle {
            background-color: #1f2937;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }
        button.lang-toggle {
            background-color: var(--accent);
            color: #0b0f19;
            border: none;
        }
        /* Phase Modules */
        .phase-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
            position: relative;
        }
        .phase-card.locked {
            opacity: 0.5;
            background-color: #0d111c;
            border-color: #1e1b4b;
        }
        .lock-banner {
            display: none;
            background-color: #312e81;
            color: #c7d2fe;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .phase-card.locked .lock-banner {
            display: block;
        }
        .phase-card.locked .test-btn {
            background-color: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }
        .phase-title {
            color: var(--accent);
            font-size: 1.4rem;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        /* Chapter Detailed Layout */
        .chapter-box {
            background-color: #1f2937;
            border-left: 4px solid var(--accent);
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .chapter-box h3 {
            color: #f3f4f6;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .content-block {
            color: #d1d5db;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .content-block ul {
            margin-left: 20px;
            margin-bottom: 10px;
        }
        .content-block li {
            margin-bottom: 6px;
        }
        .trick-box {
            background-color: var(--trick-bg);
            border: 1px solid var(--trick-border);
            color: #c7d2fe;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .trick-box strong {
            color: #818cf8;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.88rem;
        }
        .data-table th, .data-table td {
            border: 1px solid #374151;
            padding: 8px 10px;
            text-align: left;
        }
        .data-table th {
            background-color: #111827;
            color: var(--accent);
        }
        .test-btn {
            background-color: var(--accent);
            color: #0b0f19;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .test-btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }
        /* Quiz Styling */
        .quiz-modal {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 22px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .quiz-modal.active {
            display: block;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .question-text {
            font-size: 1.15rem;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        @media(max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
        .opt-btn {
            background-color: #1f2937;
            color: var(--text-main);
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.92rem;
            text-align: left;
        }
        .opt-btn.correct { background-color: var(--success) !important; color: #fff !important; }
        .opt-btn.wrong { background-color: var(--danger) !important; color: #fff !important; }
        .explanation-box {
            background-color: #0b0f19;
            border-left: 3px solid var(--accent);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            display: none;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;
        }
        .badge {
            background-color: #0284c7;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>

        </div>

            loadQuestion();
        }

        function loadQuestion() {
            const qList = pyqTests[currentActivePhase];
            const qData = qList[currentQIndex];

            document.getElementById('q-counter').innerText = `Question ${currentQIndex + 1} of ${qList.length}`;
            document.getElementById('score').innerText = currentScore;
            document.getElementById('question').innerText = `${currentQIndex + 1}. ${qData.q}`;

            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAns(idx, btn);
                optDiv.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
        }

        function checkAns(selected, btn) {
            const qData = pyqTests[currentActivePhase][currentQIndex];
            const allBtns = document.querySelectorAll('.opt-btn');

            if(selected === qData.correct) {
                btn.classList.add('correct');
                currentScore += 20;
                document.getElementById('score').innerText = currentScore;
            } else {
                btn.classList.add('wrong');
                allBtns[qData.correct].classList.add('correct');
            }

            allBtns.forEach(b => b.disabled = true);
            const exp = document.getElementById('explanation');
            exp.innerHTML = `<strong>Official TCS Explanation:</strong> ${qData.exp}`;
            exp.style.display = 'block';
        }

        function nextQuestion() {
            const totalQ = pyqTests[currentActivePhase].length;
