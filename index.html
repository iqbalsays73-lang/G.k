        function changeExam(exKey) {
            selectedExam = exKey;
            document.querySelectorAll('.exam-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('ex-' + exKey).classList.add('active');
            renderCards();
        }

        function changeSub(subKey) {
            selectedSub = subKey;
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sub-' + subKey).classList.add('active');
            renderCards();
        }

        function renderCards() {
            let list = dataset[selectedSub] || [];
            let html = `<h2 style="color:#38bdf8; font-size:18px; margin-bottom:14px;">🎯 टारगेट: ${selectedExam.toUpperCase()} | विषय: ${selectedSub.toUpperCase()}</h2>`;
            
            list.forEach(ch => {
                html += `<div class="card">
                    <h3>${ch.title}</h3>
                    <p>मास्टर ट्रिक्स, ${selectedExam.toUpperCase()} PYQs, नोट्स और टेस्ट उपलब्ध हैं।</p>
                    <div class="btn-group">
                        <button class="btn" onclick="showDetails(${ch.id})">💡 थ्योरी नोट्स + शॉर्ट ट्रिक्स</button>
                        <button class="btn btn-test" onclick="showTest(${ch.id})">📝 Practice Test Set</button>
                    </div>
                </div>`;
            });
            document.getElementById('main-area').innerHTML = html;
        }

        function showDetails(id) {
            let ch = dataset[selectedSub].find(c => c.id === id);
            let pyqArr = ch.pyqs[selectedExam] || ["डेटा उपलब्ध नहीं है।"];
            let pyqHtml = "<ul>";
            pyqArr.forEach(p => { pyqHtml += `<li><b>[${selectedExam.toUpperCase()}]</b> ${p}</li>`; });
            pyqHtml += "</ul>";

            let html = `<div>
                <button class="btn btn-back" onclick="renderCards()">⬅️ वापस सूची पर लौटें</button>
                <h2 style="color:#38bdf8; margin-bottom:12px;">${ch.title}</h2>
                <div class="box-trick">${ch.trick}</div>
                <div class="box-pyq">
                    <h4 style="margin-bottom:6px; color:#60a5fa;">🔥 2020-2025 Real One-Liner PYQs (${selectedExam.toUpperCase()})</h4>
                    ${pyqHtml}
                </div>
                <div class="box-theory">
                    <h4>📖 Complete In-Depth Theory Notes</h4>
                    ${ch.theory}
                </div>
                <button class="btn btn-test" onclick="showTest(${id})" style="margin-top:12px;">📝 इस चैप्टर का ऑनलाइन टेस्ट दें</button>
            </div>`;
            document.getElementById('main-area').innerHTML = html;
        }

        function showTest(id) {
            let ch = dataset[selectedSub].find(c => c.id === id);
            let qList = ch.questions || [];

            let html = `<div>
                <button class="btn btn-back" onclick="renderCards()">⬅️ वापस सूची पर लौटें</button>
                <h2 style="color:#38bdf8; margin-bottom:12px;">${ch.title} - Real Exam Test</h2>
                <form id="quizForm">`;

            qList.forEach((q, idx) => {
                html += `<div style="background:#1e293b; padding:15px; border-radius:8px; margin-bottom:14px; border:1px solid #334155;">
                    <p style="font-weight:bold; margin-bottom:8px;">Q${idx + 1}: ${q.q}</p>`;
                q.opts.forEach((opt, oIdx) => {
                    html += `<label class="opt-label"><input type="radio" name="q${idx}" value="${oIdx}"> ${opt}</label>`;
                });
                html += `</div>`;
            });

            html += `</form>
                <button class="btn" onclick="submitQuiz(${id})" style="padding:12px 24px; font-size:15px;">उत्तर सबमिट करें</button>
            </div>`;

            document.getElementById('main-area').innerHTML = html;
        }

        function submitQuiz(id) {
            let ch = dataset[selectedSub].find(c => c.id === id);
            let qList = ch.questions || [];
            let score = 0;

            qList.forEach((q, idx) => {
                let sel = document.querySelector(`input[name="q${idx}"]:checked`);
                if(sel && parseInt(sel.value) === q.ans) score++;
            });

            let percentage = (score / qList.length) * 100;
            alert(`आपका स्कोर: ${score}/${qList.length} (${percentage.toFixed(0)}%)\n\nशानदार! अभ्यास निरंतर जारी रखें।`);
            renderCards();
        }

        window.onload = renderCards;
