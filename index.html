<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Selection Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; line-height: 1.6; }
        
        .header { text-align: center; border-bottom: 2px solid #38bdf8; padding-bottom: 12px; margin-bottom: 20px; }
        .header h1 { color: #38bdf8; font-size: 22px; }
        .header p { color: #4ade80; font-size: 13px; font-weight: bold; }

        .title { font-size: 14px; color: #facc15; font-weight: bold; margin-bottom: 8px; }

        /* Exam Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
        .btn-exam { background: #1e293b; color: #fff; border: 2px solid #334155; padding: 12px 6px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-exam.active { background: #0284c7; border-color: #38bdf8; }

        /* Subject Flex */
        .flex-sub { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
        .btn-sub { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-sub.active { background: #10b981; color: #0f172a; border-color: #10b981; }

        /* Card */
        .card { background: #1e293b; border-left: 5px solid #38bdf8; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-top: 1px solid #334155; border-right: 1px solid #334155; border-bottom: 1px solid #334155; }
        .card h3 { font-size: 16px; color: #fff; margin-bottom: 10px; }
        
        .btn-act { background: #059669; color: #fff; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; margin-right: 5px; margin-top: 5px; }
        .btn-test { background: #d97706; }
        .btn-back { background: #475569; margin-bottom: 15px; }

        /* Boxes */
        .box-trick { background: #022c22; border-left: 4px solid #10b981; color: #6ee7b7; padding: 12px; border-radius: 6px; margin: 12px 0; font-size: 14px; font-weight: bold; }
        .box-pyq { background: #172554; border-left: 4px solid #3b82f6; color: #93c5fd; padding: 12px; border-radius: 6px; margin: 12px 0; font-size: 13px; }
        .box-theory { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 6px; margin: 12px 0; font-size: 14px; }
        
        ul { padding-left: 18px; margin-top: 5px; }
        li { margin-bottom: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>GS SELECTION ENGINE 🚀</h1>
        <p>Master Theory, Short Tricks & Real PYQs</p>
    </div>

    <!-- 1. Exam Target -->
    <div class="title">🎯 1. परीक्षा चुनें:</div>
    <div class="grid">
        <button class="btn-exam active" onclick="setExam('upssssc', this)">UPSSSC (PET/VDO)</button>
        <button class="btn-exam" onclick="setExam('ssc', this)">SSC (CGL/CHSL/GD)</button>
        <button class="btn-exam" onclick="setExam('upsi', this)">UP SI / Police</button>
        <button class="btn-exam" onclick="setExam('upsc', this)">UPSC Pre / PCS</button>
    </div>

    <!-- 2. Subject -->
    <div class="title">📚 2. विषय चुनें:</div>
    <div class="flex-sub">
        <button class="btn-sub active" onclick="setSub('history', this)">📜 History</button>
        <button class="btn-sub" onclick="setSub('geography', this)">🌍 Geography</button>
        <button class="btn-sub" onclick="setSub('polity', this)">⚖️ Polity</button>
        <button class="btn-sub" onclick="setSub('economics', this)">📈 Economics</button>
    </div>

    <!-- Output Area -->
    <div id="content-area"></div>

    <script>
        var currentExam = 'upssssc';
        var currentSub = 'history';

        var db = {
            history: [
                {
                    id: 1,
                    title: "1. प्राचीन भारत (पाषाण काल, सिंधु सभ्यता व बौद्ध धर्म)",
                    trick: "💡 <b>मास्टर ट्रिक्स:</b><br>• पाषाण: पुरापाषाण (आग) ➔ मध्यपाषाण (पशुपालन) ➔ नवपाषाण (पहिया व कृषि)<br>• बौद्ध संगीती स्थान: 'रा-वै-पा-कु' (राजगृह, वैशाली, पाटलिपुत्र, कुंडलवन)",
                    pyqs: {
                        upssssc: ["धान/चावल का सबसे पुराना साक्ष्य ➔ लहुरादेव / कोल्डिहवा", "सिंधु सभ्यता का प्रमुख बंदरगाह ➔ लोथल (गुजरात)"],
                        ssc: ["माइक्रोलिथ किस काल के औज़ार हैं? ➔ मध्यपाषाण काल", "मानव के साथ कुत्ता दफनाने के साक्ष्य ➔ बुर्जहोम"],
                        upsi: ["पशुपालन के प्रथम साक्ष्य ➔ आदमगढ़ व बागौर", "जूते हुए खेत के साक्ष्य ➔ कालीबंगा"],
                        upsc: ["कृषि साक्ष्य का कालक्रम ➔ लहुरादेव ➔ मेहरगढ़", "धौलावीरा प्रसिद्ध है ➔ उन्नत जल प्रबंधन हेतु"]
                    },
                    theory: "<b>प्रागैतिहासिक काल:</b> प्रथम धातु तांबा थी। प्रथम पालतू पशु कुत्ता था।<br><b>सिंधु घाटी सभ्यता:</b> 1921 में दयाराम साहनी द्वारा खोज की गई।"
                },
                {
                    id: 2,
                    title: "2. मध्यकालीन भारत (दिल्ली सल्तनत एवं मुगल साम्राज्य)",
                    trick: "💡 <b>मास्टर ट्रिक्स:</b><br>• सल्तनत क्रम: 'गु-खिल-तू-सै-लो' (गुलाम, खिलजी, तुगलक, सैयद, लोदी)<br>• बाबर युद्ध: 'पान खा घर चल' (पानीपत 1526, खानवा 1527, चंदेरी 1528, घाघरा 1529)",
                    pyqs: {
                        upssssc: ["प्रथम महिला मुस्लिम शासिका ➔ रजिया सुल्तान", "पानीपत का प्रथम युद्ध ➔ 1526"],
                        ssc: ["बाजार नियंत्रण प्रणाली ➔ अलाउद्दीन खिलजी", "चित्रकला का स्वर्ण काल ➔ जहांगीर"],
                        upsi: ["इक्ता प्रणाली शुरुआत ➔ इल्तुतमिश", "दीन-ए-इलाही धर्म ➔ अकबर (1582)"],
                        upsc: ["अहादी सैनिक ➔ व्यक्तिगत घुड़सवार", "मनसबदारी उद्देश्य ➔ स्वच्छ प्रशासन"]
                    },
                    theory: "<b>दिल्ली सल्तनत:</b> 1206 से 1526 तक चली।<br><b>मुगल साम्राज्य:</b> 1526 में बाबर द्वारा स्थापित।"
                }
            ],
            geography: [
                {
                    id: 1,
                    title: "1. सौरमंडल व वायुमंडल",
                    trick: "💡 <b>ट्रिक:</b> क्षोभमंडल (मौसम) ➔ समतापमंडल (ओजोन/वायुयान)",
                    pyqs: { upssssc: ["मौसम घटनाएं ➔ क्षोभमंडल"], ssc: ["जुड़वां बहन ➔ शुक्र"], upsi: ["दक्षिण भारत की लंबी नदी ➔ गोदावरी"], upsc: ["अक्षांश विस्तार ➔ 8°4' N से 37°6' N"] },
                    theory: "सबसे बड़ा ग्रह बृहस्पति है। ओजोन परत समतापमंडल में पाई जाती है।"
                }
            ],
            polity: [
                {
                    id: 1,
                    title: "1. संविधान निर्माण व मौलिक अधिकार",
                    trick: "💡 <b>ट्रिक:</b> 'सरल' (स=संसद 79, र=राज्यसभा 80, ल=लोकसभा 81)",
                    pyqs: { upssssc: ["प्रारूप समिति अध्यक्ष ➔ डॉ. बी.आर. अम्बेडकर"], ssc: ["संपत्ति अधिकार ➔ कानूनी अधिकार (300A)"], upsi: ["ग्राम पंचायत गठन ➔ अनुच्छेद 40"], upsc: ["संविधान आत्मा ➔ अनुच्छेद 32"] },
                    theory: "संविधान सभा की पहली बैठक 9 दिसंबर 1946 को हुई। लागू: 26 जनवरी 1950।"
                }
            ],
            economics: [
                {
                    id: 1,
                    title: "1. बैंकिंग, नीति आयोग व GST",
                    trick: "💡 <b>ट्रिक:</b> RBI=1935 | नीति आयोग=2015 | GST=1 जुलाई 2017",
                    pyqs: { upssssc: ["GST कब लागू हुआ? ➔ 1 जुलाई 2017"], ssc: ["नीति आयोग अध्यक्ष ➔ प्रधानमंत्री"], upsi: ["रेपो रेट ➔ RBI"], upsc: ["राष्ट्रीय आय गणना ➔ NSO"] },
                    theory: "भारत में मिश्रित अर्थव्यवस्था (Mixed Economy) पाई जाती है।"
                }
            ]
        };

        function setExam(examKey, btn) {
            currentExam = examKey;
            var btns = document.querySelectorAll('.btn-exam');
            for(var i=0; i<btns.length; i++) { btns[i].classList.remove('active'); }
            btn.classList.add('active');
            render();
        }

        function setSub(subKey, btn) {
            currentSub = subKey;
            var btns = document.querySelectorAll('.btn-sub');
            for(var i=0; i<btns.length; i++) { btns[i].classList.remove('active'); }
            btn.classList.add('active');
            render();
        }

        function render() {
            var list = db[currentSub] || [];
            var html = '<h3 style="color:#38bdf8; font-size:15px; margin-bottom:12px;">' + currentExam.toUpperCase() + ' Target: ' + currentSub.toUpperCase() + '</h3>';
            
            for(var i=0; i<list.length; i++) {
                var ch = list[i];
                html += '<div class="card">' +
                    '<h3>' + ch.title + '</h3>' +
                    '<button class="btn-act" onclick="openDetails(' + ch.id + ')">📖 थ्योरी + ट्रिक्स देखें</button>' +
                '</div>';
            }
            document.getElementById('content-area').innerHTML = html;
        }

        function openDetails(id) {
            var list = db[currentSub] || [];
            var ch = null;
            for(var i=0; i<list.length; i++) {
                if(list[i].id === id) { ch = list[i]; break; }
            }
            if(!ch) return;

            var pyqs = ch.pyqs[currentExam] || [];
            var pyqHtml = '<ul>';
            for(var j=0; j<pyqs.length; j++) {
                pyqHtml += '<li><b>[' + currentExam.toUpperCase() + ']</b> ' + pyqs[j] + '</li>';
            }
            pyqHtml += '</ul>';

            var html = '<div>' +
                '<button class="btn-act btn-back" onclick="render()">⬅️ वापस सूची पर जाएँ</button>' +
                '<h2 style="color:#38bdf8; margin-bottom:10px;">' + ch.title + '</h2>' +
                '<div class="box-trick">' + ch.trick + '</div>' +
                '<div class="box-pyq"><h4 style="margin-bottom:6px;">🔥 2020-2025 Real PYQs</h4>' + pyqHtml + '</div>' +
                '<div class="box-theory"><h4 style="color:#facc15; margin-bottom:6px;">📖 In-Depth Notes</h4>' + ch.theory + '</div>' +
            '</div>';

            document.getElementById('content-area').innerHTML = html;
        }

        window.onload = render;
    </script>
</body>
</html>
