            let score = 0;

            questions.forEach((q, idx) => {
                let selected = document.querySelector(`input[name="tq${idx}"]:checked`);
                if (selected && parseInt(selected.value) === q.ans) {
                    score++;
                }
            });

            let percentage = (score / questions.length) * 100;

            if (percentage >= 70) {
                alert(`🎉 Badhai ho! Aapne ${percentage.toFixed(0)}% score kiya hai. Agle chapters unlock ho gaye hain!`);
                sub.chapters.forEach(ch => ch.unlocked = true);
                renderDashboard();
            } else {
                alert(`❌ Aapka score ${percentage.toFixed(0)}% hai. Agla level unlock karne ke liye kam se kam 70% chahiye. Phir se try karein!`);
                startTest();
            }
        }

        window.onload = renderDashboard;
    </script>
</body>
</html>
