            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .select-group {

            align-items: center;
            gap: 8px;
        }
        select, button.lang-toggle {
            background-color: #1f2937;
            color: var(--text-main);

            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-weight: 600;

            background-color: var(--accent);
            color: #0b0f19;
            border: none;
        }

            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
            position: relative;
        }
        .phase-card.locked {
            opacity: 0.55;
            background-color: #0d111c;
            border-color: #1e1b4b;
        }
        .lock-banner {
            display: none;
            background-color: #312e81;
            color: #c7d2fe;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;

            align-items: center;

            padding-bottom: 10px;

            border-left: 4px solid var(--accent);
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .chapter-box h3 {
            color: #f3f4f6;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .content-block {
            color: #d1d5db;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .content-block ul {
            margin-left: 20px;
            margin-bottom: 10px;
        }
        .content-block li {
            margin-bottom: 6px;
        }
        .trick-box {
            background-color: var(--trick-bg);
            border: 1px solid var(--trick-border);
            color: #c7d2fe;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .trick-box strong {
            color: #818cf8;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.88rem;
        }
        .data-table th, .data-table td {
            border: 1px solid #374151;
            padding: 8px 10px;
            text-align: left;
        }
        .data-table th {
            background-color: #111827;
            color: var(--accent);
        }
        .test-btn {
            background-color: var(--accent);
            color: #0b0f19;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .test-btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }
        .test-btn:disabled {
            background-color: #374151 !important;
            color: #9ca3af !important;
            cursor: not-allowed !important;
        }
        .quiz-modal {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 22px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .quiz-modal.active {
            display: block;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .question-text {
            font-size: 1.15rem;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        @media(max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
        .opt-btn {
            background-color: #1f2937;
            color: var(--text-main);
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.92rem;
            text-align: left;
        }
        .opt-btn.correct { background-color: var(--success) !important; color: #fff !important; }
        .opt-btn.wrong { background-color: var(--danger) !important; color: #fff !important; }
        .explanation-box {

            margin-bottom: 18px;
            display: none;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;

            color: #fff;

            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>

                { q: "Megasthenes was ambassador of: (SSC CHSL 2023)", options: ["Seleucus Nicator", "Alexander", "Darius", "Antiochus"], correct: 0, exp: "Megasthenes wrote Indica." },
                { q: "Ashoka fought Kalinga War in: (SSC CGL 2022)", options: ["261 BC", "326 BC", "232 BC", "185 BC"], correct: 0, exp: "Kalinga War was fought in 261 BC." },
                { q: "Information about 16 Mahajanapadas is in: (SSC CPO 2022)", options: ["Anguttara Nikaya", "Tripitaka", "Mahavamsa", "Jataka"], correct: 0, exp: "Mentioned in Anguttara Nikaya." },
                { q: "24th Tirthankara Mahavira was born at: (SSC CGL 2020)", options: ["Vaishali (Kundagrama)", "Lumbini", "Pataliputra", "Bodh Gaya"], correct: 0, exp: "Born at Kundagrama near Vaishali." }
            ],
            3: [
                { q: "Which Gupta ruler was referred to as 'Napoleon of India'? (SSC CGL 2023)", options: ["Samudragupta", "Chandragupta II", "Skandagupta", "Kumaragupta"], correct: 0, exp: "Samudragupta was titled Napoleon of India." },
                { q: "Kailash Temple at Ellora was built by: (SSC CGL 2021)", options: ["Krishna I", "Amoghavarsha", "Dantidurga", "Govinda III"], correct: 0, exp: "Built by Rashtrakuta king Krishna I." },
                { q: "Hiuen Tsang visited India during the reign of: (SSC CHSL 2022)", options: ["Harshavardhana", "Chandragupta II", "Samudragupta", "Kanishka"], correct: 0, exp: "Visited during Harshavardhana's reign." },
                { q: "Nalanda University was established by: (SSC CPO 2023)", options: ["Kumaragupta I", "Skandagupta", "Chandragupta I", "Bhanugupta"], correct: 0, exp: "Founded by Kumaragupta I." },
                { q: "Brihadeeswarar Temple at Thanjavur was built by: (SSC CGL 2024)", options: ["Rajaraja Chola I", "Rajendra Chola", "Karikala", "Narasimhavarman"], correct: 0, exp: "Constructed by Rajaraja Chola I." }
            ]
        };

        let currentActivePhase = 1;
        let currentQIndex = 0;
        let currentScore = 0;

        function renderPage() {
            const data = fullContent[currentLang];
            document.getElementById('txt-title').innerText = data.title;
            document.getElementById('txt-subtitle').innerText = data.subtitle;
            document.getElementById('lbl-exam').innerText = data.lblExam;
            document.getElementById('lbl-lang').innerText = data.lblLang;
            document.getElementById('btn-lang').innerText = (currentLang === 'hi') ? 'English' : 'हिंदी';
            document.getElementById('btn-next').innerText = data.btnNext;

            const area = document.getElementById('content-area');
            area.innerHTML = '';

            data.phases.forEach(phase => {
                const isUnlocked = phase.id === 1 || localStorage.getItem(`phase${phase.id}_unlocked`) === 'true';
                
                let chsHtml = '';
                phase.chapters.forEach(ch => {
                    chsHtml += `
                        <div class="chapter-box">
                            <h3>${ch.title}</h3>
                            ${ch.html}
                        </div>
                    `;
                });

                const phaseCard = document.createElement('div');
                phaseCard.className = `phase-card ${isUnlocked ? '' : 'locked'}`;
                phaseCard.id = `phase${phase.id}-card`;

                phaseCard.innerHTML = `
                    <div class="lock-banner">${data.lockMsg}</div>
                    <div class="phase-title">
                        <span>${phase.name}</span>
                        <span class="badge" style="background-color: ${isUnlocked ? 'var(--success)' : '#4b5563'};">
                            ${isUnlocked ? data.unlocked : data.locked}
                        </span>
                    </div>
                    ${chsHtml}
                    <button class="test-btn" ${isUnlocked ? '' : 'disabled'} onclick="startPhaseTest(${phase.id})">
                        ${data.btnTest}
                    </button>
                `;
                area.appendChild(phaseCard);
            });
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'hi') ? 'en' : 'hi';
            renderPage();
        }

        function startPhaseTest(phaseNum) {
            currentActivePhase = phaseNum;
            currentQIndex = 0;
            currentScore = 0;

            const modal = document.getElementById('quiz-modal');
            modal.classList.add('active');
            document.getElementById('quiz-title').innerText = `Phase ${phaseNum} TCS PYQ Test`;
            modal.scrollIntoView({ behavior: 'smooth' });

            loadQuestion();
        }

        function loadQuestion() {
            const qList = pyqTests[currentActivePhase];
            const qData = qList[currentQIndex];

            document.getElementById('q-counter').innerText = `Question ${currentQIndex + 1} of ${qList.length}`;
            document.getElementById('score').innerText = currentScore;
            document.getElementById('question').innerText = `${currentQIndex + 1}. ${qData.q}`;

            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAns(idx, btn);
                optDiv.appendChild(btn);
            });

            document.getElementById('explanation').style.display = 'none';
        }

        function checkAns(selected, btn) {
            const qData = pyqTests[currentActivePhase][currentQIndex];
            const allBtns = document.querySelectorAll('.opt-btn');

            if(selected === qData.correct) {
                btn.classList.add('correct');
                currentScore += 20;
                document.getElementById('score').innerText = currentScore;
            } else {
                btn.classList.add('wrong');
                allBtns[qData.correct].classList.add('correct');
            }

            allBtns.forEach(b => b.disabled = true);
            const exp = document.getElementById('explanation');
            exp.innerHTML = `<strong>Official TCS Explanation:</strong> ${qData.exp}`;
            exp.style.display = 'block';
        }

        function nextQuestion() {
            const totalQ = pyqTests[currentActivePhase].length;
            if(currentQIndex < totalQ - 1) {
                currentQIndex++;
                loadQuestion();
            } else {
                const percentage = (currentScore / 100) * 100;
                if(percentage >= 70) {
                    alert(`🎉 Shaandar! Aapne ${percentage}% score karke Phase ${currentActivePhase} clear kar liya!`);
                    localStorage.setItem(`phase${currentActivePhase + 1}_unlocked`, "true");
                    renderPage();
                } else {
                    alert(`❌ Aapka score ${percentage}% hai. Phase unlock karne ke liye minimum 70% chahiye. Phir se attempt karein!`);
                }
                document.getElementById('quiz-modal').classList.remove('active');
            }
        }

        window.onload = function() {
            renderPage();
        };
    </script>
</body>
</html>
