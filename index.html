<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prachin Bharat Master Portal - Complete Edition</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1, h2 { color: #38bdf8; text-align: center; }
        .subject-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { background: #334155; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #0284c7; }
        .card { background: #334155; padding: 18px; margin: 12px 0; border-radius: 8px; border-left: 5px solid #38bdf8; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #0369a1; }
        .btn-test { background: #16a34a; }
        .locked { opacity: 0.5; pointer-events: none; }
        .option-label { display: block; background: #475569; padding: 10px; margin: 6px 0; border-radius: 5px; cursor: pointer; }
        .option-label:hover { background: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prachin Bharat & GS Master Portal 🚀</h1>
        <p style="text-align:center;">Pehle History, fir Geography, aur baaki subjects ke alag-alag practice sets!</p>
        
        <!-- Alag-alag Subjects ke Options / Tabs -->
        <div class="subject-tabs">
            <button class="tab-btn active" onclick="switchSubject('history')">📜 History (इतिहास)</button>
            <button class="tab-btn" onclick="switchSubject('geography')">🌍 Geography (भूगोल)</button>
            <button class="tab-btn" onclick="switchSubject('polity')">⚖️ Polity (संविधान)</button>
            <button class="tab-btn" onclick="switchSubject('economics')">📈 Economics (अर्थशास्त्र)</button>
        </div>

        <div id="app-body">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script>
        // Subject-wise Data Structure
        const portalData = {
            history: {
                name: "History",
                chapters: [
                    { id: 1, title: "सिंधु घाटी सभ्यता एवं वैदिक काल", unlocked: true, trick: "लोथल-भोगवा नदी, हड़प्पा-रावी नदी।" },
                    { id: 2, title: "महाजनपद काल एवं जैन/बौद्ध धर्म", unlocked: false, trick: "16 महाजनपद की सूची 'अंगुत्तर निकाय' में है।" },
                    { id: 3, title: "मगध साम्राज्य एवं मौर्य वंश", unlocked: false, trick: "चन्द्रगुप्त मौर्य के गुरु चाणक्य (कौटिल्य) थे।" }
                ]
            },
            geography: {
                name: "Geography",
                chapters: [
                    { id: 1, title: "सौरमंडल एवं ब्रह्मांड", unlocked: true, trick: "सूर्य के सबसे निकट ग्रह बुध (Mercury) है।" },
                    { id: 2, title: "पृथ्वी की संरचना एवं अक्षांश-देशांतर", unlocked: false, trick: "कुल अक्षांश रेखाएं 181 हैं।" },
                    { id: 3, title: "विश्व एवं भारत की नदियाँ और पर्वत", unlocked: false, trick: "गंगा नदी की लंबाई 2525 किमी है।" }
                ]
            },
            polity: {
                name: "Polity",
                chapters: [
                    { id: 1, title: "संविधान सभा एवं प्रस्तावना", unlocked: true, trick: "संविधान बनने में 2 वर्ष 11 महीने 18 दिन लगे।" },
                    { id: 2, title: "मौलिक अधिकार एवं नीति निर्देशक तत्व", unlocked: false, trick: "भाग 3 को भारत का मैग्नाकार्टा कहा जाता है।" },
                    { id: 3, title: "राष्ट्रपति, प्रधानमंत्री एवं संसद", unlocked: false, trick: "संसद के 3 अंग: राष्ट्रपति, लोकसभा, राज्यसभा।" }
                ]
            },
            economics: {
                name: "Economics",
                chapters: [
                    { id: 1, title: "राष्ट्रीय आय एवं पंचवर्षीय योजनाएं", unlocked: true, trick: "दूसरी योजना महालनोबिस मॉडल पर आधारित थी।" },
                    { id: 2, title: "बैंकिंग प्रणाली एवं RBI", unlocked: false, trick: "RBI की स्थापना 1 अप्रैल 1935 को हुई थी।" },
                    { id: 3, title: "बजट, कर प्रणाली (GST) एवं संगठन", unlocked: false, trick: "GST भारत में 1 जुलाई 2017 से लागू हुआ।" }
                ]
            }
        };

        let currentSubject = 'history';

        function switchSubject(subjectKey) {
            currentSubject = subjectKey;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderDashboard();
        }

        function renderDashboard() {
            let sub = portalData[currentSubject];
            let html = `<h2>${sub.name} Chapters & Practice</h2><div class="grid">`;
            
            sub.chapters.forEach(ch => {
                html += `<div class="card ${ch.unlocked ? '' : 'locked'}">
                    <h3>Chapter ${ch.id}: ${ch.title} ${ch.unlocked ? '🔓' : '🔒'}</h3>
                    <p>${ch.unlocked ? 'Padhne aur practice karne ke liye shuru karein.' : 'Unlock karne ke liye pichla test paas karein (70%+).'}</p>
                    <button class="btn" ${ch.unlocked ? '' : 'disabled'} onclick="startChapter(${ch.id})">Shuru Karein</button>
                </div>`;
            });
            html += `</div>`;
            document.getElementById('app-body').innerHTML = html;
        }

        function startChapter(chId) {
            let sub = portalData[currentSubject];
            let ch = sub.chapters.find(c => c.id === chId);
            
            let html = `<h2>${sub.name} - Chapter ${chId}</h2>
                <div class="card">
                    <h3>💡 Short Trick / Concept</h3>
                    <p>${ch.trick}</p>
                </div>
                <div class="card">
                    <p>Yahan is chapter ke important questions aur one-liners display honge.</p>
                </div>
                <button class="btn" onclick="renderDashboard()">Wapas Dashboard</button>`;
            
            if (chId === 3) {
                html += ` <button class="btn btn-test" onclick="startTest()">3-Chapter PYQ Test Dein (70% to Unlock Next)</button>`;
            }

            document.getElementById('app-body').innerHTML = html;
        }

        function startTest() {
            let html = `<h2>${portalData[currentSubject].name} - 3 Chapter Practice Test</h2>
                <div class="card">
                    <p><b>Q1: Is subject ke pehle 3 chapters se related mahatvapurna prashn yahan aayega?</b></p>
                    <label class="option-label"><input type="radio" name="tq1" value="0"> A) Option A (Sahi Uttar)</label>
                    <label class="option-label"><input type="radio" name="tq1" value="1"> B) Option B</label>
                </div>
                <button class="btn btn-test" onclick="submitTest()">Test Submit Karein</button>`;
            document.getElementById('app-body').innerHTML = html;
        }

        function submitTest() {
            // Mock evaluation for 70% passing
            let passed = confirm("Test evaluate ho gaya! Kya aapke 70% ya usse zyada marks aaye hain? (OK dabayein pass hone ke liye)");
            
            let sub = portalData[currentSubject];
            if (passed) {
                alert("🎉 Badhai ho! Agle chapters unlock ho gaye hain.");
                sub.chapters.forEach(ch => ch.unlocked = true);
                renderDashboard();
            } else {
                alert("❌ Kam se kam 70% marks chahiye. Dobara koshish karein!");
            }
        }

        // Load initial dashboard
        window.onload = renderDashboard;
    </script>
</body>
</html>
