        .btn { background: #0284c7; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }

        .btn-trick { background: #059669; }

        .btn-test { background: #d97706; }

        function selectExam(examKey, el) {
            currentExam = examKey;
            document.querySelectorAll('.exam-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderDashboard();
        }

        function switchSubject(subKey, el) {
            currentSubject = subKey;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderDashboard();
        }

        function renderDashboard() {
            let data = masterDatabase[currentSubject];
            if(!data) return;

            let html = `<h2 style="margin-bottom:15px; color:#38bdf8; font-size:20px;">${currentExam.toUpperCase()} Target - ${data.subjectName}</h2>`;
            data.chapters.forEach(ch => {
                html += `<div class="chapter-card">
                    <h3>${ch.title} 🔓</h3>
                    <p>विस्तृत नोट्स, मास्टर ट्रिक्स, 2020-2025 ${currentExam.toUpperCase()} PYQs और टेस्ट उपलब्ध हैं।</p>
                    <div class="btn-group">
                        <button class="btn btn-trick" onclick="openChapter(${ch.id})">💡 ट्रिक्स व विस्तृत थ्योरी पढ़ें</button>

                        <button class="btn btn-test" onclick="startChapterTest(${ch.id})">📝 Practice Test Set</button>
                    </div>
                </div>`;
            });
            document.getElementById('app-body').innerHTML = html;
        }

        function openChapter(id) {
            let data = masterDatabase[currentSubject];
            let ch = data.chapters.find(c => c.id === id);

            let pyqList = (ch.oneLiners && ch.oneLiners[currentExam]) ? ch.oneLiners[currentExam] : ["प्रश्न लोड हो रहे हैं..."];
            let pyqHtml = "<ul>";
            pyqList.forEach(item => { pyqHtml += `<li><b>[${currentExam.toUpperCase()}]</b> ${item}</li>`; });
            pyqHtml += "</ul>";

            let html = `<div class="content-box">
                <h2>${ch.title}</h2>
                
                <div class="trick-box">${ch.trick}</div>

                <div class="pyq-box">
                    <h3 style="margin-bottom:8px; color:#60a5fa;">🔥 2020-2025 ${currentExam.toUpperCase()} Real One-Liner PYQs</h3>
                    ${pyqHtml}
                </div>

                <div class="theory-box">
                    <h3>📖 In-Depth Complete Theory Notes</h3>
                    ${ch.theory}
                </div>

                <div style="margin-top:20px; display:flex; gap:10px;">
                    <button class="btn" onclick="renderDashboard()">⬅️ मुख्य डैशबोर्ड</button>
                    <button class="btn btn-test" onclick="startChapterTest(${id})">📝 टेस्ट हल करें</button>
                </div>
            </div>`;

            document.getElementById('app-body').innerHTML = html;
        }

        function startChapterTest(id) {
            let data = masterDatabase[currentSubject];
            let ch = data.chapters.find(c => c.id === id);
            let questions = ch.questions || [];

            let html = `<div class="content-box">
                <h2>${ch.title} - Real PYQ Test Set</h2>
                <form id="testForm" style="margin-top:15px;">`;

            questions.forEach((q, idx) => {
                html += `<div style="background:#0f172a; padding:15px; border-radius:8px; margin-bottom:12px; border:1px solid #334155;">
                    <p><b>Q${idx + 1}: ${q.q}</b></p>`;
                q.options.forEach((opt, oIdx) => {
                    html += `<label class="option-label"><input type="radio" name="q${idx}" value="${oIdx}"> ${opt}</label>`;
                });
                html += `</div>`;
            });

            html += `</form>
                <div style="margin-top:15px; display:flex; gap:10px;">
                    <button class="btn btn-trick" onclick="submitChapterTest(${id})">उत्तर सबमिट करें</button>
                    <button class="btn" onclick="renderDashboard()">वापस जाएँ</button>
                </div>
            </div>`;

            document.getElementById('app-body').innerHTML = html;
        }

        function submitChapterTest(id) {
            let data = masterDatabase[currentSubject];
            let ch = data.chapters.find(c => c.id === id);
            let questions = ch.questions || [];
            let score = 0;

            questions.forEach((q, idx) => {
                let selected = document.querySelector(`input[name="q${idx}"]:checked`);
                if (selected && parseInt(selected.value) === q.ans) score++;
            });

            let percentage = (score / questions.length) * 100;
            alert(`आपका स्कोर: ${score}/${questions.length} (${percentage.toFixed(0)}%)\n\nशानदार प्रयास! निरंतर अभ्यास करते रहें।`);
            renderDashboard();
        }

        window.onload = renderDashboard;
    </script>
