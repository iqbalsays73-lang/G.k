<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Selection Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; line-height: 1.6; }
        .header { text-align: center; border-bottom: 2px solid #38bdf8; padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { color: #38bdf8; font-size: 22px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn-exam { background: #1e293b; color: #fff; border: 2px solid #334155; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-exam.active { background: #0284c7; border-color: #38bdf8; }

        .flex-sub { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; }
        .btn-sub { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-sub.active { background: #10b981; color: #0f172a; }

        .card { background: #1e293b; border-left: 4px solid #38bdf8; padding: 15px; border-radius: 6px; margin-bottom: 12px; }
        .btn-act { background: #059669; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .box { background: #022c22; color: #6ee7b7; padding: 12px; border-radius: 6px; margin: 10px 0; font-weight: bold; }
        .box-pyq { background: #172554; color: #93c5fd; padding: 12px; border-radius: 6px; margin: 10px 0; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>GS SELECTION ENGINE 🚀</h1>
    </div>

    <div class="grid">
        <button class="btn-exam active" onclick="setExam('upssssc', this)">UPSSSC</button>
        <button class="btn-exam" onclick="setExam('ssc', this)">SSC</button>
        <button class="btn-exam" onclick="setExam('upsi', this)">UP SI</button>
        <button class="btn-exam" onclick="setExam('upsc', this)">UPSC</button>
    </div>

    <div class="flex-sub">
        <button class="btn-sub active" onclick="setSub('history', this)">📜 History</button>
        <button class="btn-sub" onclick="setSub('geography', this)">🌍 Geography</button>
        <button class="btn-sub" onclick="setSub('polity', this)">⚖️ Polity</button>
        <button class="btn-sub" onclick="setSub('economics', this)">📈 Economics</button>
    </div>

    <div id="app"></div>

    <script>
        var currentExam = 'upssssc';
        var currentSub = 'history';

        var db = {
            history: [
                { id: 1, title: "1. प्राचीन भारत (पाषाण व सिंधु सभ्यता)", trick: "पुरापाषाण (आग) ➔ मध्यपाषाण (पशुपालन) ➔ नवपाषाण (कृषि व पहिया)", pyq: "धान साक्ष्य ➔ लहुरादेव | बंदरगाह ➔ लोथल" },
                { id: 2, title: "2. मध्यकालीन भारत (सल्तनत व मुगल)", trick: "सल्तनत: गु-खिल-तू-सै-लो | बाबर: पान खा घर चल", pyq: "रजिया सुल्तान ➔ प्रथम महिला शासिका | 1526 ➔ पानीपत" }
            ],
            geography: [{ id: 1, title: "1. सौरमंडल व वायुमंडल", trick: "क्षोभमंडल (मौसम) ➔ समतापमंडल (ओजोन)", pyq: "मौसम घटना ➔ क्षोभमंडल" }],
            polity: [{ id: 1, title: "1. संविधान व मौलिक अधिकार", trick: "संसद: 'सरल' (79, 80, 81)", pyq: "प्रारूप समिति ➔ अम्बेडकर" }],
            economics: [{ id: 1, title: "1. बैंकिंग व GST", trick: "RBI=1935 | GST=1 जुलाई 2017", pyq: "GST ➔ 1 जुलाई 2017" }]
        };

        function setExam(e, btn) {
            currentExam = e;
            var els = document.querySelectorAll('.btn-exam');
            for(var i=0; i<els.length; i++) els[i].classList.remove('active');
            btn.classList.add('active');
            render();
        }

        function setSub(s, btn) {
            currentSub = s;
            var els = document.querySelectorAll('.btn-sub');
            for(var i=0; i<els.length; i++) els[i].classList.remove('active');
            btn.classList.add('active');
            render();
        }

        function render() {
            var list = db[currentSub] || [];
            var html = '';
            for(var i=0; i<list.length; i++) {
                html += '<div class="card"><h3>' + list[i].title + '</h3><button class="btn-act" onclick="openCh(' + list[i].id + ')">📖 थ्योरी नोट्स + ट्रिक्स पढ़ें</button></div>';
            }
            document.getElementById('app').innerHTML = html;
        }

        function openCh(id) {
            var list = db[currentSub] || [];
            var item = null;
            for(var i=0; i<list.length; i++) { if(list[i].id === id) item = list[i]; }
            if(!item) return;

            var html = '<div>' +
                '<button class="btn-act" style="background:#475569;" onclick="render()">⬅️ वापस जाएँ</button>' +
                '<h2 style="color:#38bdf8; margin-top:10px;">' + item.title + '</h2>' +
                '<div class="box">💡 ट्रिक्स:<br>' + item.trick + '</div>' +
                '<div class="box-pyq">🔥 Real PYQs [' + currentExam.toUpperCase() + ']:<br>' + item.pyq + '</div>' +
            '</div>';
            document.getElementById('app').innerHTML = html;
        }

        window.onload = render;
    </script>
</body>
</html>
