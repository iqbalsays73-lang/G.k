<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free India Exam Portal - 100% Free Preparation</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        h1, h2, h3 { color: #38bdf8; text-align: center; }
        .motto { text-align: center; color: #4ade80; font-weight: bold; margin-bottom: 25px; }
        .exam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .exam-card { background: #334155; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .exam-card:hover, .exam-card.active { border-color: #38bdf8; background: #1e293b; }
        .subject-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { background: #334155; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #0284c7; }
        .card { background: #334155; padding: 20px; margin: 15px 0; border-radius: 8px; border-left: 5px solid #38bdf8; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #0369a1; }
        .btn-test { background: #16a34a; }
        .locked { opacity: 0.5; pointer-events: none; }
        .trick-box { background: #064e3b; color: #a7f3d0; padding: 12px; border-radius: 6px; margin: 10px 0; font-weight: bold; }
        .theory-box { background: #1e293b; padding: 15px; border-radius: 6px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>भारत का मुफ़्त शिक्षा मास्टर पोर्टल 🚀</h1>
        <p class="motto">"महँगाई को मात, हर बच्चे का सिलेक्शन हमारा संकल्प!" (Full Syllabus + Short Tricks)</p>

        <!-- Exam Selection Options -->
        <h3>1. अपनी परीक्षा चुनें (Select Target Exam):</h3>
        <div class="exam-grid">
            <div class="exam-card active" onclick="selectExam('upssssc')">🎯 UPSSSC PET / VDO</div>
            <div class="exam-card" onclick="selectExam('ssc')">🏆 SSC (CGL / CHSL / GD)</div>
            <div class="exam-card" onclick="selectExam('upsi')">👮 UP SI / Police</div>
            <div class="exam-card" onclick="selectExam('upsc')">🏛️ UPSC / State PCS Pre</div>
        </div>

        <!-- Subject Selection Tabs -->
        <div class="subject-tabs">
            <button class="tab-btn active" onclick="switchSubject('history')">📜 History (इतिहास)</button>
            <button class="tab-btn" onclick="switchSubject('geography')">🌍 Geography (भूगोल)</button>
            <button class="tab-btn" onclick="switchSubject('polity')">⚖️ Polity (संविधान)</button>
            <button class="tab-btn" onclick="switchSubject('economics')">📈 Economics (अर्थशास्त्र)</button>
        </div>

        <div id="app-body">
            <!-- Content will be injected dynamically -->
        </div>
    </div>

    <!-- External Full Question & Syllabus Files -->
    <script src="history_data.js"></script>
    <script src="geography_data.js"></script>
    <script src="polity_data.js"></script>
    <script src="economics_data.js"></script>

    <script>
        let currentExam = 'upssssc';
        let currentSubject = 'history';

        function selectExam(examKey) {
            currentExam = examKey;
            document.querySelectorAll('.exam-card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderDashboard();
        }

        function switchSubject(subKey) {
            currentSubject = subKey;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderDashboard();
        }

        function renderDashboard() {
            let dataVar = currentSubject + 'Data';
            let data = window[dataVar] || null;

            if(!data) {
                document.getElementById('app-body').innerHTML = `
                    <div class="card">
                        <h3>⚠️ Data Loading...</h3>
                        <p>Kripya '${currentSubject}_data.js' file ko apni repository mein create karein.</p>
                    </div>`;
                return;
            }

            let html = `<h2>${currentExam.toUpperCase()} - ${data.subjectName} Full Syllabus</h2><div class="grid">`;
            data.chapters.forEach(ch => {
                html += `<div class="card ${ch.unlocked ? '' : 'locked'}">
                    <h3>Chapter ${ch.id}: ${ch.title} ${ch.unlocked ? '🔓' : '🔒'}</h3>
                    <p>${ch.unlocked ? 'Pura Syllabus, Theory aur Short Tricks padhein.' : 'Unlock karne ke liye pichla 3-Chapter Test (70%+) paas karein.'}</p>
                    <button class="btn" ${ch.unlocked ? '' : 'disabled'} onclick="openChapter(${ch.id})">Padhai Shuru Karein</button>
                </div>`;
            });
            html += `</div>`;
            document.getElementById('app-body').innerHTML = html;
        }

        function openChapter(id) {
            let data = window[currentSubject + 'Data'];
            let ch = data.chapters.find(c => c.id === id);

            let html = `<h2>${ch.title}</h2>
                <div class="card">
                    <h3>💡 Master Short Trick (स्मार्ट ट्रिक)</h3>
                    <div class="trick-box">${ch.trick}</div>
                    
                    <h3>📖 Complete Chapter Theory & One-Liners</h3>
                    <div class="theory-box">${ch.theory}</div>
                </div>
                <button class="btn" onclick="renderDashboard()">Back to Dashboard</button>`;

            if(id % 3 === 0) {
                html += ` <button class="btn btn-test" onclick="startTest(${id})">Take 3-Chapter PYQ Test (70% to Unlock)</button>`;
            }

            document.getElementById('app-body').innerHTML = html;
        }

        // Initialize portal on load
        window.onload = renderDashboard;
    </script>
</body>
</html>
