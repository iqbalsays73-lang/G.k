<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Selection Engine 🚀</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; line-height: 1.6; }
        
        .header { text-align: center; border-bottom: 2px solid #38bdf8; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: #38bdf8; font-size: 24px; margin-bottom: 5px; }
        .header p { color: #4ade80; font-size: 14px; font-weight: bold; }

        .section-title { font-size: 15px; font-weight: bold; color: #facc15; margin-bottom: 10px; }

        /* Exam Selector Buttons */
        .exam-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .exam-btn { background: #1e293b; color: #f8fafc; border: 2px solid #334155; padding: 12px 8px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
        .exam-btn.active { background: #0284c7; border-color: #38bdf8; color: #ffffff; }

        /* Subject Tab Buttons */
        .sub-grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
        .sub-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .sub-btn.active { background: #10b981; color: #0f172a; border-color: #10b981; }

        /* Card Layout */
        .card { background: #1e293b; border: 1px solid #334155; border-left: 5px solid #38bdf8; padding: 16px; border-radius: 8px; margin-bottom: 15px; }
        .card h3 { color: #ffffff; font-size: 17px; margin-bottom: 10px; }
        
        /* Action Buttons */
        .btn-group { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn { background: #059669; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-test { background: #d97706; }
        .btn-back { background: #475569; margin-bottom: 15px; }

        /* Detailed Boxes */
        .box-trick { background: #022c22; border-left: 4px solid #10b981; color: #6ee7b7; padding: 12px; border-radius: 6px; margin: 12px 0; font-weight: bold; }
        .box-pyq { background: #172554; border-left: 4px solid #3b82f6; color: #93c5fd; padding: 12px; border-radius: 6px; margin: 12px 0; }
        .box-theory { background: #0f172a; border: 1px solid #334155; padding: 14px; border-radius: 6px; margin: 12px 0; font-size: 14px; }
        
        ul { padding-left: 18px; margin-top: 6px; }
        li { margin-bottom: 6px; }
        
        .opt-label { display: block; background: #334155; padding: 10px; margin: 8px 0; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>GS SELECTION ENGINE 🚀</h1>
        <p>100% Free - Theory, Short Tricks & 2020-2025 PYQs</p>
    </div>

    <!-- 1. Exam Target Selector -->
    <div class="section-title">🎯 कदम 1: अपनी परीक्षा चुनें:</div>
    <div class="exam-grid">
        <button class="exam-btn active" id="ex-upssssc" onclick="changeExam('upssssc')">UPSSSC (PET/VDO)</button>
        <button class="exam-btn" id="ex-ssc" onclick="changeExam('ssc')">SSC (CGL/CHSL/GD)</button>
        <button class="exam-btn" id="ex-upsi" onclick="changeExam('upsi')">UP SI / Police</button>
        <button class="exam-btn" id="ex-upsc" onclick="changeExam('upsc')">UPSC Pre / PCS</button>
    </div>

    <!-- 2. Subject Selector -->
    <div class="section-title">📚 कदम 2: विषय चुनें:</div>
    <div class="sub-grid">
        <button class="sub-btn active" id="sub-history" onclick="changeSub('history')">📜 History</button>
        <button class="sub-btn" id="sub-geography" onclick="changeSub('geography')">🌍 Geography</button>
        <button class="sub-btn" id="sub-polity" onclick="changeSub('polity')">⚖️ Polity</button>
        <button class="sub-btn" id="sub-economics" onclick="changeSub('economics')">📈 Economics</button>
    </div>

    <!-- Main Container Area -->
    <div id="main-area"></div>

    <script>
        let selectedExam = 'upssssc';
        let selectedSub = 'history';

        const dataset = {
            history: [
                {
                    id: 1,
                    title: "1. प्राचीन भारत (पाषाण काल, सिंधु सभ्यता व बौद्ध/जैन धर्म)",
                    trick: "💡 <b>मास्टर ट्रिक्स:</b><br>• <b>पाषाण काल:</b> पुरापाषाण (आग) ➔ मध्यपाषाण (पशुपालन) ➔ नवपाषाण (पहिया व कृषि)<br>• <b>बौद्ध संगीती स्थान:</b> 'रा-वै-पा-कु' (राजगृह, वैशाली, पाटलिपुत्र, कुंडलवन)<br>• <b>सिंधु नदियाँ:</b> लोथल-भोगवा, हड़प्पा-रावी, मोहनजोदड़ो-सिंधु",
                    pyqs: {
                        upssssc: ["धान/चावल का सबसे प्राचीनतम साक्ष्य ➔ लहुरादेव / कोल्डिहवा", "सिंधु सभ्यता का बंदरगाह ➔ लोथल (गुजरात)"],
                        ssc: ["माइक्रोलिथ किस काल के औज़ार हैं? ➔ मध्यपाषाण काल", "मानव के साथ कुत्ता दफनाने के साक्ष्य ➔ बुर्जहोम (J&K)"],
                        upsi: ["पशुपालन के प्रथम साक्ष्य ➔ आदमगढ़ व बागौर", "जूते हुए खेत के साक्ष्य ➔ कालीबंगा (राजस्थान)"],
                        upsc: ["कृषि साक्ष्य का सही कालक्रम ➔ लहुरादेव ➔ मेहरगढ़", "धौलावीर स्थल प्रसिद्ध है ➔ उन्नत जल प्रबंधन हेतु"]
                    },
                    theory: "<b>प्रागैतिहासिक काल:</b> लिखित साक्ष्य उपलब्ध नहीं। प्रथम धातु: तांबा। प्रथम पालतू पशु: कुत्ता।<br><b>सिंधु घाटी सभ्यता:</b> कांस्ययुगीन नगरीय सभ्यता (खोज: 1921 दयाराम साहनी)।",
                    questions: [
                        { q: "मानव द्वारा प्रयोग में लाई गई पहली धातु कौन-सी थी?", opts: ["लोहा", "तांबा", "कांसा", "सोना"], ans: 1 },
                        { q: "पहिए का आविष्कार किस काल में हुआ था?", opts: ["पुरापाषाण", "मध्यपाषाण", "नवपाषाण", "ताम्रपाषाण"], ans: 2 }
                    ]
                },
                {
                    id: 2,
                    title: "2. मध्यकालीन भारत (दिल्ली सल्तनत एवं मुगल साम्राज्य)",
                    trick: "💡 <b>मास्टर ट्रिक्स:</b><br>• <b>सल्तनत वंश क्रम:</b> 'गु-खिल-तू-सै-लो' (गुलाम ➔ खिलजी ➔ तुगलक ➔ सैयद ➔ लोदी)<br>• <b>बाबर के युद्ध:</b> 'पान खा घर चल' (पानीपत 1526, खानवा 1527, चंदेरी 1528, घाघरा 1529)",
                    pyqs: {
                        upssssc: ["भारत की प्रथम महिला मुस्लिम शासिका ➔ रजिया सुल्तान", "पानीपत का प्रथम युद्ध ➔ 1526"],
                        ssc: ["बाजार नियंत्रण प्रणाली किसने लागू की? ➔ अलाउद्दीन खिलजी", "चित्रकला का स्वर्ण काल ➔ जहांगीर"],
                        upsi: ["इक्ता प्रणाली की शुरुआत ➔ इल्तुतमिश", "दीन-ए-इलाही धर्म की स्थापना ➔ अकबर (1582)"],
                        upsc: ["अहादी सैनिक कौन थे? ➔ व्यक्तिगत घुड़सवार सैनिक", "मनसबदारी प्रथा का मुख्य उद्देश्य ➔ प्रशासनिक मजबूती"]
                    },
                    theory: "<b>दिल्ली सल्तनत (1206-1526):</b> कुतुबुद्दीन ऐबक द्वारा स्थापित।<br><b>मुगल साम्राज्य (1526-1857):</b> बाबर ने इब्राहिम लोदी को हराकर स्थापना की।",
                    questions: [
                        { q: "प्रथम महिला मुस्लिम शासिका कौन थीं?", opts: ["चांद बीबी", "रजिया सुल्तान", "नूरजहाँ", "मुमताज"], ans: 1 },
                        { q: "पानीपत का प्रथम युद्ध कब लड़ा गया?", opts: ["1526", "1556", "1761", "1527"], ans: 0 }
                    ]
                },
                {
                    id: 3,
                    title: "3. आधुनिक भारत (1857 की क्रांति व स्वतंत्रता संग्राम)",
                    trick: "💡 <b>मास्टर ट्रिक्स:</b><br>• <b>1857 केंद्र:</b> लखनऊ (बेगम हजरत महल), कानपुर (नाना साहेब), बिहार (कुंवर सिंह)<br>• <b>गांधी आंदोलन:</b> चंपारण (1917) ➔ असहयोग (1920) ➔ सविनय अवज्ञा (1930) ➔ भारत छोड़ो (1942)",
                    pyqs: {
                        upssssc: ["1857 क्रांति की शुरुआत ➔ 10 मई 1857 (मेरठ)", "ब्रह्म समाज की स्थापना ➔ राजा राममोहन राय (1828)"],
                        ssc: ["सती प्रथा का अंत ➔ लॉर्ड विलियम बैंटिक (1829)", "जलियांवाला बाग हत्याकांड ➔ 13 अप्रैल 1919"],
                        upsi: ["1857 में बिहार से नेतृत्व ➔ कुंवर सिंह", "भारतीय राष्ट्रीय कांग्रेस स्थापना ➔ 28 दिसंबर 1885"],
                        upsc: ["लखनऊ समझौता ➔ 1916 (कांग्रेस व मुस्लिम लीग का विलय)", "गांधी-इरविन समझौता ➔ 1931"]
                    },
                    theory: "<b>1857 क्रांति:</b> मेरठ से प्रारंभ।<br><b>स्वतंत्रता आंदोलन:</b> 1885 में कांग्रेस गठन, 1905 बंगाल विभाजन, 1947 में स्वतंत्रता प्राप्त।",
                    questions: [
                        { q: "1857 की क्रांति कहाँ से शुरू हुई थी?", opts: ["झांसी", "कानपुर", "मेरठ", "दिल्ली"], ans: 2 },
                        { q: "ब्रह्म समाज की स्थापना किसने की?", opts: ["दयानंद सरस्वती", "राजा राममोहन राय", "विवेकानंद", "ईश्वरचंद्र"], ans: 1 }
                    ]
                }
            ],
            geography: [
                {
                    id: 1,
                    title: "1. सौरमंडल व वायुमंडल",
                    trick: "💡 <b>ट्रिक:</b> वायुमंडल परतें ➔ क्षोभमंडल (मौसम) ➔ समतापमंडल (ओजोन/वायुयान)",
                    pyqs: { upssssc: ["मौसम घटनाएं ➔ क्षोभमंडल"], ssc: ["जुड़वां बहन ➔ शुक्र"], upsi: ["दक्षिण भारत की लंबी नदी ➔ गोदावरी"], upsc: ["अक्षांश विस्तार ➔ 8°4' N से 37°6' N"] },
                    theory: "सबसे बड़ा ग्रह बृहस्पति है। ओजोन परत समतापमंडल में पाई जाती है।",
                    questions: [{ q: "सौरमंडल का सबसे बड़ा ग्रह कौन-सा है?", opts: ["शुक्र", "बृहस्पति", "शनि", "मंगल"], ans: 1 }]
                }
            ],
            polity: [
                {
                    id: 1,
                    title: "1. संविधान निर्माण व मौलिक अधिकार",
                    trick: "💡 <b>ट्रिक:</b> 'सरल' ➔ स=संसद (79), र=राज्यसभा (80), ल=लोकसभा (81)",
                    pyqs: { upssssc: ["प्रारूप समिति अध्यक्ष ➔ डॉ. बी.आर. अम्बेडकर"], ssc: ["संपत्ति अधिकार ➔ कानूनी अधिकार (300A)"], upsi: ["ग्राम पंचायत गठन ➔ अनुच्छेद 40"], upsc: ["संविधान की आत्मा ➔ अनुच्छेद 32"] },
                    theory: "संविधान सभा की प्रथम बैठक 9 दिसंबर 1946 को हुई। संविधान 26 जनवरी 1950 को लागू हुआ।",
                    questions: [{ q: "प्रारूप समिति के अध्यक्ष कौन थे?", opts: ["राजेंद्र प्रसाद", "पंडित नेहरू", "डॉ. बी.आर. अम्बेडकर", "सच्चिदानंद"], ans: 2 }]
                }
            ],
            economics: [
                {
                    id: 1,
                    title: "1. बैंकिंग, नीति आयोग व GST",
                    trick: "💡 <b>ट्रिक:</b> RBI स्थापना = 1935 | नीति आयोग = 2015 | GST लागू = 1 जुलाई 2017",
                    pyqs: { upssssc: ["GST कब लागू हुआ? ➔ 1 जुलाई 2017"], ssc: ["नीति आयोग अध्यक्ष ➔ प्रधानमंत्री"], upsi: ["रेपो रेट कौन तय करता है? ➔ RBI"], upsc: ["राष्ट्रीय आय गणना ➔ NSO"] },
                    theory: "भारत में मिश्रित अर्थव्यवस्था (Mixed Economy) पाई जाती है।",
                    questions: [{ q: "नीति आयोग की स्थापना कब हुई थी?", opts: ["2014", "2015", "2016", "2017"], ans: 1 }]
                }
            ]
        };

        function changeExam(exKey) {
            selectedExam = exKey;
            document.querySelectorAll('.exam-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('ex-' + exKey).classList.add('active');
            renderCards();
        }

        function changeSub(subKey) {
            selectedSub = subKey;
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sub-' + subKey).classList.add('active');
            renderCards();
        }

        function renderCards() {
            let list = dataset[selectedSub] || [];
            let html = `<h2 style="color:#38bdf8; font-size:18px; margin-bottom:12px;">${selectedExam.toUpperCase()} Target: ${selectedSub.toUpperCase()}</h2>`;
            
            list.forEach(ch => {
                html += `<div class="card">
                    <h3>${ch.title}</h3>
                    <p style="font-size:13px; color:#94a3b8;">थ्योरी नोट्स, मास्टर ट्रिक्स, PYQs और टेस्ट हल करें।</p>
                    <div class="btn-group">
                        <button class="btn" onclick="showDetails(${ch.id})">📖 थ्योरी नोट्स + ट्रिक्स पढ़ें</button>
                        <button class="btn btn-test" onclick="showTest(${ch.id})">📝 Practice Test Set</button>
                    </div>
                </div>`;
            });
            document.getElementById('main-area').innerHTML = html;
        }

        function showDetails(id) {
            let ch = dataset[selectedSub].find(c => c.id === id);
            let pyqArr = ch.pyqs[selectedExam] || ["कोई डेटा उपलब्ध नहीं है।"];
            let pyqHtml = "<ul>";
            pyqArr.forEach(p => { pyqHtml += `<li><b>[${selectedExam.toUpperCase()}]</b> ${p}</li>`; });
            pyqHtml += "</ul>";

            let html = `<div>
                <button class="btn btn-back" onclick="renderCards()">⬅️ वापस सूची पर जाएँ</button>
                <h2 style="color:#38bdf8; margin-bottom:10px;">${ch.title}</h2>
                <div class="box-trick">${ch.trick}</div>
                <div class="box-pyq">
                    <h4 style="margin-bottom:6px;">🔥 2020-2025 Real One-Liner PYQs (${selectedExam.toUpperCase()})</h4>
                    ${pyqHtml}
                </div>
                <div class="box-theory">
                    <h4 style="color:#facc15; margin-bottom:6px;">📖 Complete Theory Notes</h4>
                    ${ch.theory}
                </div>
                <button class="btn btn-test" onclick="showTest(${id})" style="margin-top:10px;">📝 इस चैप्टर का टेस्ट दें</button>
            </div>`;
            document.getElementById('main-area').innerHTML = html;
        }

        function showTest(id) {
            let ch = dataset[selectedSub].find(c => c.id === id);
            let qList = ch.questions || [];

            let html = `<div>
                <button class="btn btn-back" onclick="renderCards()">⬅️ वापस सूची पर जाएँ</button>
                <h2 style="color:#38bdf8; margin-bottom:10px;">${ch.title} - Online Test</h2>
                <form id="quizForm">`;

            qList.forEach((q, idx) => {
                html += `<div style="background:#1e293b; padding:12px; border-radius:6px; margin-bottom:10px; border:1px solid #334155;">
                    <p style="font-weight:bold;">Q${idx + 1}: ${q.q}</p>`;
                q.opts.forEach((opt, oIdx) => {
                    html += `<label class="opt-label"><input type="radio" name="q${idx}" value="${oIdx}"> ${opt}</label>`;
                });
                html += `</div>`;
            });

            html += `</form>
                <button class="btn" onclick="submitQuiz(${id})">उत्तर सबमिट करें</button>
            </div>`;

            document.getElementById('main-area').innerHTML = html;
        }

        function submitQuiz(id) {
            let ch = dataset[selectedSub].find(c => c.id === id);
            let qList = ch.questions || [];
            let score = 0;

            qList.forEach((q, idx) => {
                let sel = document.querySelector(`input[name="q${idx}"]:checked`);
                if(sel && parseInt(sel.value) === q.ans) score++;
            });

            alert(`आपका स्कोर: ${score}/${qList.length}\n\nबहुत बढ़िया! अभ्यास जारी रखें।`);
            renderCards();
        }

        // Initialize on load
        window.onload = renderCards;
    </script>
</body>
</html>
