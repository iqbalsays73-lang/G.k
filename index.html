            });

            html += `</form>
                <button class="btn" onclick="submitQuiz(${id})" style="padding:12px 24px; font-size:15px;">उत्तर सबमिट करें</button>
            </div>`;

            document.getElementById('main-area').innerHTML = html;
        }

        function submitQuiz(id) {
            let ch = dataset[selectedSub].find(c => c.id === id);
            let qList = ch.questions || [];
            let score = 0;

            qList.forEach((q, idx) => {
                let sel = document.querySelector(`input[name="q${idx}"]:checked`);
                if(sel && parseInt(sel.value) === q.ans) score++;
            });

            let percentage = (score / qList.length) * 100;
            alert(`आपका स्कोर: ${score}/${qList.length} (${percentage.toFixed(0)}%)\n\nशानदार! अभ्यास निरंतर जारी रखें।`);
            renderCards();
        }

        window.onload = renderCards;
    </script>
</body>
</html>
